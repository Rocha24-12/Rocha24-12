<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-label="Learning progress" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a5c"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#87ceeb"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="clip"><rect width="800" height="250" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="800" height="250" fill="url(#bg)"/>

    <g filter="url(#blur)">
      <circle cx="680" cy="60" r="80" fill="#56ccf2" opacity="0.5">
        <animate attributeName="cy" values="60;190;60" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="200" r="90" fill="#2f80ed" opacity="0.6">
        <animate attributeName="cx" values="110;300;110" dur="13s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="28" y="24" width="744" height="202" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.28"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <circle cx="64" cy="58" r="4" fill="#56ccf2">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="78" y="62" font-size="12" letter-spacing="4" fill="#87ceeb">LEARNING PROGRESS</text>

      <!-- Barra 1: Python 60% (ancho máximo 470 → 60% = 282) -->
      <text x="60" y="104" font-size="13" fill="#ffffff">Python</text>
      <rect x="170" y="94" width="470" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="170" y="94" width="0" height="10" rx="5" fill="url(#bar)">
        <animate attributeName="width" from="0" to="282" dur="1.6s" fill="freeze"/>
      </rect>
      <text x="720" y="104" font-size="13" fill="#bbdefb" text-anchor="end">60%</text>

      <!-- Barra 2: Git 40% (= 188) -->
      <text x="60" y="140" font-size="13" fill="#ffffff">Git</text>
      <rect x="170" y="130" width="470" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="170" y="130" width="0" height="10" rx="5" fill="url(#bar)">
        <animate attributeName="width" from="0" to="188" begin="0.2s" dur="1.6s" fill="freeze"/>
      </rect>
      <text x="720" y="140" font-size="13" fill="#bbdefb" text-anchor="end">40%</text>

      <!-- Barra 3: GitHub 35% (= 164.5) -->
      <text x="60" y="176" font-size="13" fill="#ffffff">GitHub</text>
      <rect x="170" y="166" width="470" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="170" y="166" width="0" height="10" rx="5" fill="url(#bar)">
        <animate attributeName="width" from="0" to="164.5" begin="0.4s" dur="1.6s" fill="freeze"/>
      </rect>
      <text x="720" y="176" font-size="13" fill="#bbdefb" text-anchor="end">35%</text>

      <!-- Barra 4: Markdown 70% (= 329) -->
      <text x="60" y="212" font-size="13" fill="#ffffff">Markdown</text>
      <rect x="170" y="202" width="470" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="170" y="202" width="0" height="10" rx="5" fill="url(#bar)">
        <animate attributeName="width" from="0" to="329" begin="0.6s" dur="1.6s" fill="freeze"/>
      </rect>
      <text x="720" y="212" font-size="13" fill="#bbdefb" text-anchor="end">70%</text>
    </g>
  </g>
</svg>
