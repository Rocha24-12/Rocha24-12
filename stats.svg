<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="Estadísticas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a5c"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56ccf2"/>
      <stop offset="1" stop-color="#bbdefb"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <clipPath id="clip"><rect width="800" height="200" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="800" height="200" fill="url(#bg)"/>

    <g filter="url(#blur)">
      <circle cx="140" cy="100" r="80" fill="#56ccf2" opacity="0.5">
        <animate attributeName="cx" values="140;660;140" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="660" cy="100" r="80" fill="#2f80ed" opacity="0.6">
        <animate attributeName="cx" values="660;140;660" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">

      <!-- Tarjeta 1: Repositorios (EDITA el número) -->
      <rect x="28" y="24" width="240" height="152" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.28"/>
      <circle cx="148" cy="82" r="36" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>
      <circle cx="148" cy="82" r="36" fill="none" stroke="url(#ring)" stroke-width="6" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="226.2" transform="rotate(-90 148 82)">
        <animate attributeName="stroke-dashoffset" from="226.2" to="113" dur="1.8s" fill="freeze"/>
      </circle>
      <text x="148" y="91" font-size="26" font-weight="700" fill="#ffffff">5</text>
      <text x="148" y="152" font-size="11" letter-spacing="3" fill="#87ceeb">REPOSITORIES</text>

      <!-- Tarjeta 2: Contribuciones (EDITA el número) -->
      <rect x="280" y="24" width="240" height="152" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.28"/>
      <circle cx="400" cy="82" r="36" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>
      <circle cx="400" cy="82" r="36" fill="none" stroke="url(#ring)" stroke-width="6" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="226.2" transform="rotate(-90 400 82)">
        <animate attributeName="stroke-dashoffset" from="226.2" to="68" begin="0.3s" dur="1.8s" fill="freeze"/>
      </circle>
      <text x="400" y="91" font-size="26" font-weight="700" fill="#ffffff">120</text>
      <text x="400" y="152" font-size="11" letter-spacing="3" fill="#87ceeb">CONTRIBUTIONS</text>

      <!-- Tarjeta 3: Racha (EDITA el número) -->
      <rect x="532" y="24" width="240" height="152" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.28"/>
      <circle cx="652" cy="82" r="36" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>
      <circle cx="652" cy="82" r="36" fill="none" stroke="url(#ring)" stroke-width="6" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="226.2" transform="rotate(-90 652 82)">
        <animate attributeName="stroke-dashoffset" from="226.2" to="136" begin="0.6s" dur="1.8s" fill="freeze"/>
      </circle>
      <text x="652" y="91" font-size="26" font-weight="700" fill="#ffffff">7</text>
      <text x="652" y="152" font-size="11" letter-spacing="3" fill="#87ceeb">DAY STREAK</text>

    </g>
  </g>
</svg>
