<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-label="Sobre mí" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a5c"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="clip"><rect width="800" height="250" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="800" height="250" fill="url(#bg)"/>

    <g filter="url(#blur)">
      <circle cx="120" cy="60" r="80" fill="#56ccf2" opacity="0.5">
        <animate attributeName="cx" values="120;260;120" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="690" cy="200" r="90" fill="#2f80ed" opacity="0.6">
        <animate attributeName="cy" values="200;90;200" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="28" y="24" width="744" height="202" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.28"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <circle cx="64" cy="58" r="4" fill="#56ccf2">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="78" y="62" font-size="12" letter-spacing="4" fill="#87ceeb">ABOUT</text>

      <text x="60" y="104" font-size="26" font-weight="700" fill="#ffffff">Hey there! I'm Rocha 👋</text>

      <text x="60" y="138" font-size="14" fill="#dbeafe">Python learner &amp; aspiring developer (Class of 2026), passionate about</text>
      <text x="60" y="160" font-size="14" fill="#dbeafe">crafting simple, clean and useful projects. Currently focused on learning</text>
      <text x="60" y="182" font-size="14" fill="#dbeafe">Python and building my first projects with Git and GitHub.</text>

      <text x="60" y="210" font-size="11" letter-spacing="1" fill="#87ceeb">#python  ·  #git  ·  #github  ·  #learning</text>
    </g>
  </g>
</svg>
