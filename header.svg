<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="Rocha24-12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a5c"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#87ceeb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#87ceeb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bbdefb" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#87ceeb" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <clipPath id="clip"><rect width="800" height="260" rx="20"/></clipPath>
    <clipPath id="panelclip"><rect x="28" y="28" width="744" height="204" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="800" height="260" fill="url(#bg)"/>

    <!-- Orbes difuminados que se mueven -->
    <g filter="url(#blur)">
      <circle cx="150" cy="80" r="90" fill="#56ccf2" opacity="0.65">
        <animate attributeName="cx" values="150;320;150" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;180;80" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="650" cy="190" r="100" fill="#2f80ed" opacity="0.7">
        <animate attributeName="cx" values="650;470;650" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="190;70;190" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="400" cy="130" r="70" fill="#bbdefb" opacity="0.45">
        <animate attributeName="cx" values="400;560;240;400" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="130;60;190;130" dur="13s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Panel de vidrio -->
    <rect x="28" y="28" width="744" height="204" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.28"/>

    <!-- Brillo que recorre el borde superior -->
    <g clip-path="url(#panelclip)">
      <rect x="-300" y="28" width="300" height="2" fill="url(#shine)">
        <animate attributeName="x" values="-300;800" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Texto -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="400" y="82" font-size="12" letter-spacing="5" fill="#87ceeb">PYTHON LEARNER · FUTURE DEVELOPER</text>

      <text x="400" y="142" font-size="54" font-weight="700" fill="url(#title)" opacity="0">
        Rocha24-12
        <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
      </text>

      <text x="400" y="174" font-size="15" fill="#bbdefb" opacity="0">
        finding peace in every shade of blue
        <animate attributeName="opacity" values="0;1" begin="0.8s" dur="1.6s" fill="freeze"/>
      </text>

      <!-- Etiquetas -->
      <rect x="198" y="192" width="130" height="24" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="263" y="208" font-size="11" fill="#ffffff">Learning Python</text>

      <rect x="340" y="192" width="140" height="24" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="410" y="208" font-size="11" fill="#ffffff">Building in public</text>

      <rect x="492" y="192" width="110" height="24" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="547" y="208" font-size="11" fill="#ffffff">Open Source</text>
    </g>
  </g>
</svg>
