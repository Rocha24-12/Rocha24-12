<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170" role="img" aria-label="Tech stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a5c"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <clipPath id="clip"><rect width="800" height="170" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="800" height="170" fill="url(#bg)"/>

    <g filter="url(#blur)">
      <circle cx="200" cy="90" r="70" fill="#56ccf2" opacity="0.45">
        <animate attributeName="cx" values="200;600;200" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="90" r="70" fill="#2f80ed" opacity="0.55">
        <animate attributeName="cx" values="600;200;600" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="28" y="20" width="744" height="130" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.28"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="400" y="54" font-size="12" letter-spacing="5" fill="#87ceeb" text-anchor="middle">TECH STACK</text>

      <!-- Python -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.8s" fill="freeze"/>
        <rect x="132" y="76" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
        <circle cx="150" cy="93" r="4" fill="#56ccf2"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
        <text x="164" y="98" font-size="13" fill="#ffffff">Python</text>
      </g>

      <!-- Git -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.8s" fill="freeze"/>
        <rect x="246" y="76" width="70" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
        <circle cx="264" cy="93" r="4" fill="#2f80ed"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
        <text x="278" y="98" font-size="13" fill="#ffffff">Git</text>
      </g>

      <!-- GitHub -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.8s" fill="freeze"/>
        <rect x="330" y="76" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
        <circle cx="348" cy="93" r="4" fill="#bbdefb"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
        <text x="362" y="98" font-size="13" fill="#ffffff">GitHub</text>
      </g>

      <!-- VS Code -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.8s" fill="freeze"/>
        <rect x="444" y="76" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
        <circle cx="462" cy="93" r="4" fill="#56ccf2"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
        <text x="476" y="98" font-size="13" fill="#ffffff">VS Code</text>
      </g>

      <!-- Markdown -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.8s" fill="freeze"/>
        <rect x="558" y="76" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
        <circle cx="576" cy="93" r="4" fill="#2f80ed"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
        <text x="590" y="98" font-size="13" fill="#ffffff">Markdown</text>
      </g>

      <text x="400" y="134" font-size="11" fill="#87ceeb" fill-opacity="0.85" text-anchor="middle">always learning something new</text>
    </g>
  </g>
</svg>
